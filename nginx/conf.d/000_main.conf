server {
    listen 80;
    server_name smpyrogateway.bsnl.co.in;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl ;
    http2 on;
    server_name smpyrogateway.bsnl.co.in;

    ssl_certificate     /etc/nginx/ssl/smpyrogateway.bsnl.co.in.crt;
    ssl_certificate_key /etc/nginx/ssl/smpyrogateway.bsnl.co.in.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"          always;
    add_header X-XSS-Protection        "1; mode=block" always;
    client_max_body_size 1m;

   
    access_log  /var/log/nginx/smpyro_access.log;
    error_log   /var/log/nginx/smpyro_error.log warn;


    include /etc/nginx/sites-enabled/*.conf;

    # block everything else
    location / {
        return 404;
    }
}